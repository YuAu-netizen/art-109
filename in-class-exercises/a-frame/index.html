<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-Frame AR Fun</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="https://unpkg.com/@c-frame/aframe-physics-system@4.2.3/dist/aframe-physics-system.min.js"></script>
</head>
<body>
    <a-scene>
          <a-image position="-1 0.5 -5" src="assests/guinea-pig-&-hamster-group.jpg"></a-image>
          <a-image position="1.4 0.5 -2" src="assests/guinea-smile.jpg"></a-image>
          <a-image position="1.3 0.5 -5" src="assests/hamster-in-house-with-pinecone.jpg"></a-image>
          <a-image position="0 0.5 -2" src="assests/hamster.png"></a-image>
          <a-image position="-1.4 0.5 -2" src="assests/stylish-guinea-pig.jpg"></a-image>

      <a-box position="2 1.5 -6" rotation="5 15 45" color="#4CC3D9"></a-box>
      <a-sphere position="-2 5 -8" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="2 0.75 -6" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>  
</body>
</html>
